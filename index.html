<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพิมพ์ใบรายงานมิเตอร์ผิดปกติ - กฟส.กำแพงแสน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- pdf-lib -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <!-- fontkit สำหรับรองรับฟอนต์ไทย -->
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold text-blue-700 mb-2">⚡ ใบรายงานมิเตอร์ผิดปกติ</h1>
        <p class="text-sm text-slate-500 mb-6">การไฟฟ้าส่วนภูมิภาค (กฟส.กำแพงแสน) - กรอกข้อมูลแล้วกดพรีวิวหรือดาวน์โหลด</p>

        <form id="meterForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">เลขที่เอกสาร</label>
                    <input type="text" id="docNo" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="เช่น 001/2569">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">วันที่รายงาน</label>
                    <input type="date" id="docDate" class="w-full p-2 border rounded-lg">
                </div>
            </div>

            <div class="border-t pt-4">
                <h3 class="font-semibold text-blue-600 mb-3">1. ข้อมูลผู้ใช้ไฟฟ้า</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">ชื่อผู้ใช้ไฟฟ้า</label>
                        <input type="text" id="cusName" class="w-full p-2 border rounded-lg" placeholder="นายสมชาย ใจดี">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">หมายเลขผู้ใช้ไฟ (Consumer No.)</label>
                        <input type="text" id="cusNo" class="w-full p-2 border rounded-lg" placeholder="0200xxxxxx">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium mb-1">ที่อยู่</label>
                        <input type="text" id="address" class="w-full p-2 border rounded-lg" placeholder="บ้านเลขที่ / หมู่บ้าน">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">หมู่ที่ (ม.)</label>
                        <input type="text" id="moo" class="w-full p-2 border rounded-lg" placeholder="เช่น 5">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="block text-sm font-medium mb-1">เบอร์โทรศัพท์</label>
                    <input type="text" id="phone" class="w-full p-2 border rounded-lg" placeholder="08x-xxx-xxxx">
                </div>
            </div>

            <div class="border-t pt-4">
                <h3 class="font-semibold text-blue-600 mb-3">2. ข้อมูลมิเตอร์</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ขนาดมิเตอร์</label>
                        <select id="meterSize" class="w-full p-2 border rounded-lg bg-white">
                            <option value="5(15)">5(15)</option>
                            <option value="5(45)">5(45)</option>
                            <option value="5(100)">5(100)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">PEA (หมายเลขซีเรียลมิเตอร์)</label>
                        <input type="text" id="peaNo" class="w-full p-2 border rounded-lg" placeholder="หมายเลข PEA">
                    </div>
                </div>
            </div>

            <div class="border-t pt-4">
                <h3 class="font-semibold text-blue-600 mb-3">3. รายละเอียดความผิดปกติ</h3>
                <div class="space-y-4 text-sm md:text-base">
                    <!-- 3.1 มิเตอร์ชำรุด -->
                    <label class="flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-2">
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="errorType" value="3.1" checked class="text-blue-600">
                            <span>3.1 มิเตอร์ชำรุด (ต่อตรงเวลา:</span>
                        </div>
                        <div class="flex items-center space-x-2 pl-6 md:pl-0">
                            <input type="time" id="time31" class="border p-1 rounded text-sm"> 
                            <span>น. วันที่</span>
                            <input type="date" id="date31" class="border p-1 rounded text-sm">
                            <span>)</span>
                        </div>
                    </label>

                    <!-- 3.2 VT ชำรุด -->
                    <label class="flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-2">
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="errorType" value="3.2" class="text-blue-600">
                            <span>3.2 VT ชำรุด เฟส</span>
                        </div>
                        <div class="flex items-center space-x-2 pl-6 md:pl-0 flex-wrap">
                            <input type="text" id="phase32" class="border-b px-1 w-12 text-sm text-center">
                            <span>เวลา</span>
                            <input type="time" id="time32" class="border p-1 rounded text-sm">
                            <span>น. วันที่</span>
                            <input type="date" id="date32" class="border p-1 rounded text-sm">
                        </div>
                    </label>

                    <!-- 3.3 CT ชำรุด -->
                    <label class="flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-2">
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="errorType" value="3.3" class="text-blue-600">
                            <span>3.3 CT ชำรุด เฟส</span>
                        </div>
                        <div class="flex items-center space-x-2 pl-6 md:pl-0 flex-wrap">
                            <input type="text" id="phase33" class="border-b px-1 w-12 text-sm text-center">
                            <span>เวลา</span>
                            <input type="time" id="time33" class="border p-1 rounded text-sm">
                            <span>น. วันที่</span>
                            <input type="date" id="date33" class="border p-1 rounded text-sm">
                        </div>
                    </label>
                </div>
            </div>

            <div class="border-t pt-4">
                <label class="block text-sm font-medium mb-1">4. สถานที่ / บริเวณใกล้เคียง</label>
                <input type="text" id="location" class="w-full p-2 border rounded-lg" placeholder="จุดสังเกต / สถานใกล้เคียง">
            </div>

            <div class="border-t pt-4 space-y-3">
                <label class="block text-sm font-medium">ชื่อพนักงานผู้รายงาน (พชง.)</label>
                <input type="text" id="officerName" class="w-full p-2 border rounded-lg" placeholder="ชื่อ-นามสกุล พชง.">

                <!-- ลายเซ็น -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">ลายเซ็นพนักงาน (วาดด้วยมือ/เมาส์)</label>
                        <button type="button" onclick="clearSignature()" class="text-xs text-red-600 hover:text-red-800 font-semibold cursor-pointer">
                            🗑️ ล้างลายเซ็น
                        </button>
                    </div>
                    <div class="border-2 border-dashed border-slate-300 rounded-lg overflow-hidden bg-slate-50 touch-none">
                        <canvas id="sigCanvas" width="500" height="150" class="w-full h-36 cursor-crosshair block"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                <button type="button" onclick="previewPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center space-x-2">
                    <span>👁️ พรีวิว / ปริ้นท์ (ไม่เปลืองพื้นที่)</span>
                </button>
                <button type="button" onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center space-x-2">
                    <span>📥 ดาวน์โหลดไฟล์ PDF</span>
                </button>
            </div>
        </form>
    </div>

    <div id="previewModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-4xl h-[90vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg">📄 พรีวิวตัวอย่างก่อนพิมพ์</h3>
                <button onclick="closePreview()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-bold cursor-pointer">ปิดหน้าต่าง</button>
            </div>
            <div class="flex-1 bg-slate-100 p-2">
                <iframe id="pdfPreviewFrame" class="w-full h-full rounded-lg border"></iframe>
            </div>
        </div>
    </div>

    <script>
        let isDrawing = false;
        let sigCanvas, sigCtx;
        let hasSignature = false;

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('docDate').value = today;
            document.getElementById('date31').value = today;
            document.getElementById('date32').value = today;
            document.getElementById('date33').value = today;

            const nowStr = new Date().toTimeString().slice(0, 5);
            document.getElementById('time31').value = nowStr;
            document.getElementById('time32').value = nowStr;
            document.getElementById('time33').value = nowStr;

            // ระบบวาดลายเซ็น (Canvas)
            sigCanvas = document.getElementById('sigCanvas');
            sigCtx = sigCanvas.getContext('2d');
            sigCtx.lineWidth = 2.5;
            sigCtx.lineCap = 'round';
            sigCtx.strokeStyle = '#000000';

            // Event Listeners สำหรับเมาส์และ Touch หน้าจอ
            sigCanvas.addEventListener('mousedown', startDrawing);
            sigCanvas.addEventListener('mousemove', drawLine);
            sigCanvas.addEventListener('mouseup', stopDrawing);
            sigCanvas.addEventListener('mouseleave', stopDrawing);

            sigCanvas.addEventListener('touchstart', startDrawingTouch);
            sigCanvas.addEventListener('touchmove', drawLineTouch);
            sigCanvas.addEventListener('touchend', stopDrawing);
        });

        function getPos(e) {
            const rect = sigCanvas.getBoundingClientRect();
            const scaleX = sigCanvas.width / rect.width;
            const scaleY = sigCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            hasSignature = true;
            const pos = getPos(e);
            sigCtx.beginPath();
            sigCtx.moveTo(pos.x, pos.y);
        }

        function drawLine(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            sigCtx.lineTo(pos.x, pos.y);
            sigCtx.stroke();
        }

        function startDrawingTouch(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
                startDrawing(e.touches[0]);
            }
        }

        function drawLineTouch(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
                drawLine(e.touches[0]);
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearSignature() {
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            hasSignature = false;
        }

        async function createPDFDocument() {
            const { PDFDocument, rgb } = PDFLib;

            const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');

            const fontUrl = baseUrl + '/THSarabun.ttf';
            const fontBytes = await fetch(fontUrl).then(res => {
                if (!res.ok) throw new Error("ไม่พบไฟล์ฟอนต์ THSarabun.ttf ใน GitHub");
                return res.arrayBuffer();
            });

            const pdfUrl = baseUrl + '/template.pdf';
            const existingPdfBytes = await fetch(pdfUrl).then(res => {
                if (!res.ok) throw new Error("ไม่พบไฟล์ template.pdf ใน GitHub");
                return res.arrayBuffer();
            });

            const pdfDoc = await PDFDocument.load(existingPdfBytes);
            
            pdfDoc.registerFontkit(fontkit);
            const customFont = await pdfDoc.embedFont(fontBytes);

            const firstPage = pdfDoc.getPages()[0];

            const draw = (text, x, y) => {
                const fontSize = 16;
                firstPage.drawText(text || '', {
                    x: x,
                    y: y,
                    size: fontSize,
                    font: customFont,
                    rgb: rgb(0, 0, 0)
                });
            };

            const formatThaiDate = (rawDate) => {
                if (!rawDate) return "";
                const [year, month, day] = rawDate.split('-');
                const thaiMonths = [
                    '', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
                    'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
                ];
                const thaiYear = parseInt(year) + 543;
                const thaiMonth = thaiMonths[parseInt(month)];
                const cleanDay = parseInt(day);
                return `${cleanDay} ${thaiMonth} ${thaiYear}`;
            };

            // ดึงค่าจากฟอร์ม
            const docNo = document.getElementById('docNo').value;
            const docDate = formatThaiDate(document.getElementById('docDate').value);
            const cusName = document.getElementById('cusName').value;
            const cusNo = document.getElementById('cusNo').value;
            const address = document.getElementById('address').value;
            const moo = document.getElementById('moo').value;
            const phone = document.getElementById('phone').value;
            const meterSize = document.getElementById('meterSize').value;
            const peaNo = document.getElementById('peaNo').value;
            
            const time31 = document.getElementById('time31').value;
            const date31 = formatThaiDate(document.getElementById('date31').value);

            const phase32 = document.getElementById('phase32').value;
            const time32 = document.getElementById('time32').value;
            const date32 = formatThaiDate(document.getElementById('date32').value);

            const phase33 = document.getElementById('phase33').value;
            const time33 = document.getElementById('time33').value;
            const date33 = formatThaiDate(document.getElementById('date33').value);

            const location = document.getElementById('location').value;
            const officerName = document.getElementById('officerName').value;

            // วาดข้อมูลลง PDF
            draw(docNo, 74, 661);       
            draw(docDate, 430, 700);     
            draw(cusName, 130, 620);
            draw(address, 300, 620);
            draw(moo, 450, 620);
            draw(phone, 130, 595);
            draw(cusNo, 400, 595);
            draw(meterSize, 120, 565);
            draw(peaNo, 260, 565);

            draw(time31, 220, 517);     
            draw(date31, 350, 517);     

            draw(phase32, 180, 480);
            draw(time32,  260, 480);
            draw(date32,  390, 480);

            draw(phase33, 180, 445);
            draw(time33,  260, 445);
            draw(date33,  390, 445);

            draw(location, 150, 400);
            draw(officerName, 200, 340);

            // ฝังลายเซ็นลงใน PDF (หากมีการวาด)
            if (hasSignature) {
                const sigDataUrl = sigCanvas.toDataURL('image/png');
                const sigImageBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());
                const sigImage = await pdfDoc.embedPng(sigImageBytes);
                
                // สามารถปรับตำแหน่ง x, y และขนาด width, height ของลายเซ็นตรงนี้ได้ตามต้องการครับ
                firstPage.drawImage(sigImage, {
                    x: 200,
                    y: 340,
                    width: 120,
                    height: 36,
                });
            }

            return await pdfDoc.save();
        }

        async function previewPDF() {
            try {
                const pdfBytes = await createPDFDocument();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                document.getElementById('pdfPreviewFrame').src = blobUrl;
                document.getElementById('previewModal').classList.remove('hidden');
                document.getElementById('previewModal').classList.add('flex');
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการพรีวิว: " + error.message);
                console.error(error);
            }
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('flex');
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('pdfPreviewFrame').src = "";
        }

        async function downloadPDF() {
            try {
                const pdfBytes = await createPDFDocument();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'รายงานมิเตอร์ผิดปกติ-พิมพ์แล้ว.pdf';
                link.click();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการดาวน์โหลด: " + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>

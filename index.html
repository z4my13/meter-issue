<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานมิเตอร์ผิดปกติ - กฟส.กำแพงแสน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- pdf-lib -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <!-- fontkit สำหรับรองรับฟอนต์ไทย -->
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-zinc-100 text-zinc-800 antialiased py-6 px-4 md:py-12">
    <div class="max-w-2xl mx-auto bg-white border border-zinc-200/80 p-6 md:p-10 rounded-2xl shadow-xs">
        <!-- Header -->
        <div class="border-b border-zinc-100 pb-5 mb-6">
            <span class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">PEA • Provincial Electricity Authority</span>
            <h1 class="text-xl md:text-2xl font-semibold text-zinc-900 mt-1">ใบรายงานมิเตอร์ผิดปกติ</h1>
            <p class="text-xs md:text-sm text-zinc-500 mt-0.5">การไฟฟ้าส่วนภูมิภาค สาขาอำเภอกำแพงแสน</p>
        </div>

        <form id="meterForm" class="space-y-6">
            <!-- ส่วนที่ 1: ข้อมูลทั่วไป -->
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">เลขที่เอกสาร</label>
                        <input type="text" id="docNo" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="เช่น 001/2569">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">วันที่รายงาน</label>
                        <input type="date" id="docDate" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2: ข้อมูลผู้ใช้ไฟฟ้า -->
            <div class="border-t border-zinc-100 pt-5 space-y-4">
                <h3 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">1. ข้อมูลผู้ใช้ไฟฟ้า</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">ชื่อผู้ใช้ไฟฟ้า</label>
                        <input type="text" id="cusName" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="นายสมชาย ใจดี">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">หมายเลขผู้ใช้ไฟ (Consumer No.)</label>
                        <input type="text" id="cusNo" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="0200xxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">ที่อยู่</label>
                        <input type="text" id="address" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="บ้านเลขที่ / หมู่บ้าน">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">หมู่ที่</label>
                        <input type="text" id="moo" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="เช่น 5">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-600 mb-1.5">เบอร์โทรศัพท์</label>
                    <input type="text" id="phone" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="08x-xxx-xxxx">
                </div>
            </div>

            <!-- ส่วนที่ 3: ข้อมูลมิเตอร์ -->
            <div class="border-t border-zinc-100 pt-5 space-y-4">
                <h3 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">2. ข้อมูลมิเตอร์</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">ขนาดมิเตอร์</label>
                        <select id="meterSize" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition">
                            <option value="5(15)">5(15)</option>
                            <option value="5(45)">5(45)</option>
                            <option value="5(100)">5(100)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-600 mb-1.5">PEA (หมายเลขซีเรียลมิเตอร์)</label>
                        <input type="text" id="peaNo" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="หมายเลข PEA">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 4: รายละเอียดความผิดปกติ -->
            <div class="border-t border-zinc-100 pt-5 space-y-4">
                <h3 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">3. รายละเอียดความผิดปกติ</h3>
                
                <div class="space-y-3 text-sm">
                    <!-- 3.1 -->
                    <label class="flex flex-col md:flex-row md:items-center justify-between p-3 bg-zinc-50/40 border border-zinc-200/60 rounded-xl gap-2 cursor-pointer hover:border-zinc-300 transition">
                        <div class="flex items-center space-x-2.5">
                            <input type="radio" name="errorType" value="3.1" checked class="accent-zinc-900">
                            <span class="text-xs font-medium text-zinc-700">3.1 มิเตอร์ชำรุด (ต่อตรงเวลา)</span>
                        </div>
                        <div class="flex items-center space-x-1.5 text-xs">
                            <input type="time" id="time31" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                            <span class="text-zinc-400">น.</span>
                            <input type="date" id="date31" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                        </div>
                    </label>

                    <!-- 3.2 -->
                    <label class="flex flex-col md:flex-row md:items-center justify-between p-3 bg-zinc-50/40 border border-zinc-200/60 rounded-xl gap-2 cursor-pointer hover:border-zinc-300 transition">
                        <div class="flex items-center space-x-2.5">
                            <input type="radio" name="errorType" value="3.2" class="accent-zinc-900">
                            <span class="text-xs font-medium text-zinc-700">3.2 VT ชำรุด เฟส</span>
                            <input type="text" id="phase32" class="border-b border-zinc-300 bg-transparent px-1 w-8 text-center text-xs font-medium focus:outline-none">
                        </div>
                        <div class="flex items-center space-x-1.5 text-xs">
                            <input type="time" id="time32" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                            <span class="text-zinc-400">น.</span>
                            <input type="date" id="date32" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                        </div>
                    </label>

                    <!-- 3.3 -->
                    <label class="flex flex-col md:flex-row md:items-center justify-between p-3 bg-zinc-50/40 border border-zinc-200/60 rounded-xl gap-2 cursor-pointer hover:border-zinc-300 transition">
                        <div class="flex items-center space-x-2.5">
                            <input type="radio" name="errorType" value="3.3" class="accent-zinc-900">
                            <span class="text-xs font-medium text-zinc-700">3.3 CT ชำรุด เฟส</span>
                            <input type="text" id="phase33" class="border-b border-zinc-300 bg-transparent px-1 w-8 text-center text-xs font-medium focus:outline-none">
                        </div>
                        <div class="flex items-center space-x-1.5 text-xs">
                            <input type="time" id="time33" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                            <span class="text-zinc-400">น.</span>
                            <input type="date" id="date33" class="border border-zinc-200 bg-white px-2 py-1 rounded">
                        </div>
                    </label>
                </div>
            </div>

            <!-- ส่วนที่ 5: สถานที่และพนักงาน -->
            <div class="border-t border-zinc-100 pt-5 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-600 mb-1.5">4. สถานที่ / บริเวณใกล้เคียง</label>
                    <input type="text" id="location" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="จุดสังเกต / สถานใกล้เคียง">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-600 mb-1.5">ชื่อพนักงานผู้รายงาน (พชง.)</label>
                    <input type="text" id="officerName" class="w-full px-3 py-2 text-sm bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 transition" placeholder="ชื่อ-นามสกุล พชง.">
                </div>

                <!-- ลายเซ็น -->
                <div class="pt-1">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-medium text-zinc-600">ลายเซ็นพนักงานผู้รายงาน</label>
                        <button type="button" onclick="clearSignature()" class="text-xs text-zinc-400 hover:text-zinc-700 transition cursor-pointer">
                            ล้างลายเซ็น
                        </button>
                    </div>
                    <div class="border border-zinc-200 rounded-xl overflow-hidden bg-white touch-none shadow-2xs">
                        <canvas id="sigCanvas" width="500" height="130" class="w-full h-32 cursor-crosshair block"></canvas>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4">
                <button type="button" onclick="previewPDF()" class="w-full py-2.5 px-4 text-sm font-medium bg-white border border-zinc-300 text-zinc-700 rounded-xl hover:bg-zinc-50 transition cursor-pointer shadow-2xs">
                    👁️ พรีวิวเอกสาร
                </button>
                <button type="button" onclick="downloadPDF()" class="w-full py-2.5 px-4 text-sm font-medium bg-zinc-900 text-white rounded-xl hover:bg-zinc-800 transition cursor-pointer shadow-2xs">
                    📥 ดาวน์โหลด PDF
                </button>
            </div>
        </form>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-4xl h-[90vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-zinc-200">
            <div class="bg-zinc-900 text-white px-6 py-3.5 flex justify-between items-center">
                <h3 class="font-medium text-sm">พรีวิวเอกสาร PDF</h3>
                <button onclick="closePreview()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition cursor-pointer">ปิดหน้าต่าง</button>
            </div>
            <div class="flex-1 bg-zinc-100 p-2">
                <iframe id="pdfPreviewFrame" class="w-full h-full rounded-xl border border-zinc-200 bg-white"></iframe>
            </div>
        </div>
    </div>

    <script>
        let isDrawing = false;
        let sigCanvas, sigCtx;
        let hasSignature = false;

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('docDate').value = today;
            document.getElementById('date31').value = today;
            document.getElementById('date32').value = today;
            document.getElementById('date33').value = today;

            const nowStr = new Date().toTimeString().slice(0, 5);
            document.getElementById('time31').value = nowStr;
            document.getElementById('time32').value = nowStr;
            document.getElementById('time33').value = nowStr;

            sigCanvas = document.getElementById('sigCanvas');
            sigCtx = sigCanvas.getContext('2d');
            sigCtx.lineWidth = 2;
            sigCtx.lineCap = 'round';
            sigCtx.strokeStyle = '#18181b';

            sigCanvas.addEventListener('mousedown', startDrawing);
            sigCanvas.addEventListener('mousemove', drawLine);
            sigCanvas.addEventListener('mouseup', stopDrawing);
            sigCanvas.addEventListener('mouseleave', stopDrawing);

            sigCanvas.addEventListener('touchstart', startDrawingTouch);
            sigCanvas.addEventListener('touchmove', drawLineTouch);
            sigCanvas.addEventListener('touchend', stopDrawing);
        });

        function getPos(e) {
            const rect = sigCanvas.getBoundingClientRect();
            const scaleX = sigCanvas.width / rect.width;
            const scaleY = sigCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            hasSignature = true;
            const pos = getPos(e);
            sigCtx.beginPath();
            sigCtx.moveTo(pos.x, pos.y);
        }

        function drawLine(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            sigCtx.lineTo(pos.x, pos.y);
            sigCtx.stroke();
        }

        function startDrawingTouch(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
                startDrawing(e.touches[0]);
            }
        }

        function drawLineTouch(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
                drawLine(e.touches[0]);
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearSignature() {
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            hasSignature = false;
        }

        async function createPDFDocument() {
            const { PDFDocument, rgb } = PDFLib;

            const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');

            const fontUrl = baseUrl + '/THSarabun.ttf';
            const fontBytes = await fetch(fontUrl).then(res => {
                if (!res.ok) throw new Error("ไม่พบไฟล์ฟอนต์ THSarabun.ttf");
                return res.arrayBuffer();
            });

            const pdfUrl = baseUrl + '/template.pdf';
            const existingPdfBytes = await fetch(pdfUrl).then(res => {
                if (!res.ok) throw new Error("ไม่พบไฟล์ template.pdf");
                return res.arrayBuffer();
            });

            const pdfDoc = await PDFDocument.load(existingPdfBytes);
            pdfDoc.registerFontkit(fontkit);
            const customFont = await pdfDoc.embedFont(fontBytes);
            const firstPage = pdfDoc.getPages()[0];

            const draw = (text, x, y) => {
                const fontSize = 16;
                firstPage.drawText(text || '', {
                    x: x,
                    y: y,
                    size: fontSize,
                    font: customFont,
                    rgb: rgb(0, 0, 0)
                });
            };

            const formatThaiDate = (rawDate) => {
                if (!rawDate) return "";
                const [year, month, day] = rawDate.split('-');
                const thaiMonths = [
                    '', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
                    'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
                ];
                const thaiYear = parseInt(year) + 543;
                const thaiMonth = thaiMonths[parseInt(month)];
                const cleanDay = parseInt(day);
                return `${cleanDay} ${thaiMonth} ${thaiYear}`;
            };

            const docNo = document.getElementById('docNo').value;
            const docDate = formatThaiDate(document.getElementById('docDate').value);
            const cusName = document.getElementById('cusName').value;
            const cusNo = document.getElementById('cusNo').value;
            const address = document.getElementById('address').value;
            const moo = document.getElementById('moo').value;
            const phone = document.getElementById('phone').value;
            const meterSize = document.getElementById('meterSize').value;
            const peaNo = document.getElementById('peaNo').value;
            
            const time31 = document.getElementById('time31').value;
            const date31 = formatThaiDate(document.getElementById('date31').value);

            const phase32 = document.getElementById('phase32').value;
            const time32 = document.getElementById('time32').value;
            const date32 = formatThaiDate(document.getElementById('date32').value);

            const phase33 = document.getElementById('phase33').value;
            const time33 = document.getElementById('time33').value;
            const date33 = formatThaiDate(document.getElementById('date33').value);

            const location = document.getElementById('location').value;
            const officerName = document.getElementById('officerName').value;

            // พิกัดการวาง (สามารถจูนตัวเลข X, Y ต่อได้ตามเดิมครับ)
            draw(docNo, 74, 661);       
            draw(docDate, 313, 661);     
            draw(cusName, 130, 620);
            draw(address, 300, 620);
            draw(moo, 450, 620);
            draw(phone, 130, 595);
            draw(cusNo, 400, 595);
            draw(meterSize, 120, 565);
            draw(peaNo, 260, 565);

            draw(time31, 220, 517);     
            draw(date31, 350, 517);     

            draw(phase32, 180, 480);
            draw(time32,  260, 480);
            draw(date32,  390, 480);

            draw(phase33, 180, 445);
            draw(time33,  260, 445);
            draw(date33,  390, 445);

            draw(location, 150, 400);
            draw(officerName, 200, 340); //ชื่อผู้รายงาน
            draw(officerName, 200, 340); //ชื่อผู้อยู่เวร Ref.ชื่อผู้รายงาน

            if (hasSignature) {
                const sigDataUrl = sigCanvas.toDataURL('image/png');
                const sigImageBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());
                const sigImage = await pdfDoc.embedPng(sigImageBytes);
                
                firstPage.drawImage(sigImage, {
                    x: 200,
                    y: 340,
                    width: 120,
                    height: 36,
                });
            }

            return await pdfDoc.save();
        }

        async function previewPDF() {
            try {
                const pdfBytes = await createPDFDocument();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                document.getElementById('pdfPreviewFrame').src = blobUrl;
                document.getElementById('previewModal').classList.remove('hidden');
                document.getElementById('previewModal').classList.add('flex');
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการพรีวิว: " + error.message);
                console.error(error);
            }
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('flex');
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('pdfPreviewFrame').src = "";
        }

        async function downloadPDF() {
            try {
                const pdfBytes = await createPDFDocument();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'รายงานมิเตอร์ผิดปกติ.pdf';
                link.click();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการดาวน์โหลด: " + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
